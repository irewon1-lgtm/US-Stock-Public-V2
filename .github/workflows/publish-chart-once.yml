name: Publish chart once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-chart-once.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-v2-static-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Preserve current live data
        shell: bash
        env:
          LIVE_BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          BASE="${LIVE_BASE%/}"
          mkdir -p "$RUNNER_TEMP/site"
          curl -L -fSs --connect-timeout 10 --max-time 120 --retry 3 "$BASE/state-v2.json?cb=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/site/state-v2.json"
          curl -L -fSs --connect-timeout 10 --max-time 60 --retry 3 "$BASE/last-refresh.json?cb=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/site/last-refresh.json"
          python scripts/validate-state.py "$RUNNER_TEMP/site/state-v2.json" data/universe-3700.json config/metrics-v2.json
          cp chart.html "$RUNNER_TEMP/site/chart.html"
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>US Stock Public V2</title><p>US Stock Public V2 data endpoint.</p>' > "$RUNNER_TEMP/site/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
          retention-days: 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
