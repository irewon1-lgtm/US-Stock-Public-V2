name: V4 F4 2021-12 CompanyFacts Standard Shares
on:
  push:
    paths: ['v4-f4-202112-companyfacts-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests
      - run: python v4-sec-cover/recover_f4_202112_companyfacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-f4-202112-companyfacts
          path: v4-sec-f4-202112-companyfacts-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-f4-202112-companyfacts-output/
          git commit -m 'Add targeted F4 CompanyFacts standard shares' || true
          git pull --rebase origin main
          git push origin HEAD:main
