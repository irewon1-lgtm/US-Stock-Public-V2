name: V4 Finnhub Archive Daily Validation
on:
  push:
    paths: ['v4-finnhub-validation-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas numpy
      - run: python v4-finnhub-archive/validate_daily.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-finnhub-archive-validation-output/
          git commit -m 'Add V4 Finnhub daily validation' || true
          git pull --rebase origin main
          git push origin HEAD:main
