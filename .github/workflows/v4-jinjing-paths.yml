name: V4 JinJing Tree Paths
on:
  push:
    paths: ['v4-jinjing-paths-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python v4-jinjing/probe_paths.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-jinjing-probe-output/tree_paths.json
          git commit -m 'Add JinJing tree paths' || true
          git pull --rebase origin main
          git push origin HEAD:main
