name: V4 HF Yahoo Missing Price Recovery
on:
  push:
    paths: ['v4-hf-yahoo-recovery-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pyarrow requests
      - run: python v4-hf-yahoo/recover_missing.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-hf-yahoo-recovery
          path: v4-hf-yahoo-recovery-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-hf-yahoo-recovery-output/
          git commit -m 'Add V4 HF Yahoo missing price recovery' || true
          git pull --rebase origin main
          git push origin HEAD:main
