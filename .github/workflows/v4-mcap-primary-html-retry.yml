name: V4 Market Cap Primary HTML Retry
on:
  push:
    paths: ['v4-mcap-primary-html-retry-trigger.txt']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests lxml
      - run: python v4-sec-cover/recover_mcap_primary_html_retry.py --shard ${{ matrix.shard }} --nshards 2
      - uses: actions/upload-artifact@v4
        with:
          name: v4-mcap-primary-html-retry-${{ matrix.shard }}
          path: v4-sec-mcap-primary-html-retry-output/
          retention-days: 30
