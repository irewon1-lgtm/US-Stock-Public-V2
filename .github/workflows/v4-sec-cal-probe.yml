name: V4 SEC CAL Standard Parent Probe
on:
  push:
    paths: ['v4-sec-cal-probe-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests lxml
      - run: python v4-sec-cover/probe_cal_standard_parent.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-cal-probe-output/
          git commit -m 'Add SEC CAL standard-parent probe' || true
          git pull --rebase origin main
          git push origin HEAD:main
