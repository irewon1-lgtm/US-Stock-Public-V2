name: V4 SEC F34 Exact Alt Supplemental
on:
  push:
    paths:
      - 'v4-sec-f34-exact-alt-supp-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python v4-sec-cover/recover_f34_exact_alt_supp.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-sec-f34-exact-alt-supp
          path: v4-sec-f34-exact-alt-supp-output/
          retention-days: 7
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-f34-exact-alt-supp-output/
          git commit -m 'Add strict NEXT1 supplemental exact-alt facts' || true
          git pull --rebase origin main
          git push origin HEAD:main
