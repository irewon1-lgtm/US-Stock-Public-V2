name: V4 Finnhub Liquidity Calibration
on:
  push:
    paths: ['v4-finnhub-liquidity-cal-trigger.txt']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: [2020,2021,2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas numpy
      - run: python v4-finnhub-archive/calibrate_liquidity.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: v4-finnhub-liquidity-cal-${{ matrix.year }}
          path: |
            v4-finnhub-liquidity-cal-output/features_*.csv.gz
            v4-finnhub-liquidity-cal-output/validation_*.csv
            v4-finnhub-liquidity-cal-output/summary_*.json
          retention-days: 30
