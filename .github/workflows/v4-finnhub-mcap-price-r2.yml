name: V4 Finnhub Market Cap Price R2
on:
  push:
    paths: ['v4-finnhub-mcap-price-r2-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas numpy
      - run: python v4-finnhub-archive/recover_mcap_price_r2.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-finnhub-mcap-price-r2
          path: v4-finnhub-mcap-price-r2-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-finnhub-mcap-price-r2-output/price_validation.csv v4-finnhub-mcap-price-r2-output/summary.json
          git commit -m 'Add V4 Finnhub mcap price R2 summary' || true
          git pull --rebase origin main
          git push origin HEAD:main
