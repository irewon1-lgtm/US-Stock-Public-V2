name: V4 Market Cap Only 31 Recovery
on:
  push:
    paths: ['v4-mcap-only-31-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas numpy requests duckdb
      - run: python v4-sec-cover/recover_mcap_only_31.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-mcap-only-31
          path: v4-mcap-only-31-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-mcap-only-31-output/summary.json v4-mcap-only-31-output/sec_audit.csv
          git commit -m 'Add targeted market-cap-only recovery summary' || true
          git pull --rebase origin main
          git push origin HEAD:main
