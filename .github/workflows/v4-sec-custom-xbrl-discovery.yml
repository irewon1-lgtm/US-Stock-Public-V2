name: V4 SEC Custom XBRL Discovery
on:
  push:
    paths: ['v4-sec-custom-xbrl-discovery-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests
      - run: python v4-sec-cover/discover_custom_xbrl_labels.py --shard ${{ matrix.shard }} --nshards 4
      - uses: actions/upload-artifact@v4
        with:
          name: custom-xbrl-shard-${{ matrix.shard }}
          path: v4-sec-custom-xbrl-output/
          retention-days: 30
  summarize:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: custom-xbrl-shard-*
          path: downloaded
      - run: mkdir -p v4-sec-custom-xbrl-output && python v4-sec-cover/merge_custom_xbrl_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-sec-custom-xbrl-discovery
          path: v4-sec-custom-xbrl-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-custom-xbrl-output/custom_candidate_summary.csv v4-sec-custom-xbrl-output/custom_discovery_audit.csv v4-sec-custom-xbrl-output/custom_discovery_summary.json
          git commit -m 'Add V4 SEC custom XBRL discovery summary' || true
          git pull --rebase origin main
          git push origin HEAD:main
