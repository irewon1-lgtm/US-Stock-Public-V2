name: V4 Jinjing Delisted Symbol Probe
on:
  push:
    paths: ['v4-jinjing-delisted-symbol-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas
      - run: python v4-jinjing-daily/probe_delisted_symbols.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-jinjing-daily-probe-output/delisted_symbols.json
          git commit -m 'Add Jinjing delisted symbol probe' || true
          git pull --rebase origin main
          git push origin HEAD:main
