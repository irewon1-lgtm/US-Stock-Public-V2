name: V4 SEC Visible CFO Revenue
on:
  push:
    paths: ['v4-sec-visible-cfo-revenue-trigger.txt']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: {shard: [0,1]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests lxml
      - run: python v4-sec-cover/recover_visible_cfo_revenue.py --shard ${{ matrix.shard }} --nshards 2
      - uses: actions/upload-artifact@v4
        with:
          name: v4-sec-visible-cfo-revenue-${{ matrix.shard }}
          path: v4-sec-visible-cfo-revenue-output/
          retention-days: 30
