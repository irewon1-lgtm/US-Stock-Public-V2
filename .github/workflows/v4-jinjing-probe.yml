name: V4 JinJing Daily Archive Probe
on:
  push:
    paths: ['v4-jinjing-probe-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas numpy
      - run: python v4-jinjing/probe.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-jinjing-probe-output/probe.json v4-jinjing-probe-output/validation.csv || true
          git commit -m 'Add V4 JinJing daily archive probe' || true
          git pull --rebase origin main
          git push origin HEAD:main
