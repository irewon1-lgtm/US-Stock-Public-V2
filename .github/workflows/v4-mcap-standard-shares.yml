name: V4 Market Cap Standard Shares Recovery
on:
  push:
    paths: ['v4-mcap-standard-shares-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests
      - run: python v4-sec-cover/recover_mcap_standard_shares.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-mcap-standard-shares
          path: v4-sec-mcap-standard-shares-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-mcap-standard-shares-output/
          git commit -m 'Add V4 market-cap standard shares recovery' || true
          git pull --rebase origin main
          git push origin HEAD:main
