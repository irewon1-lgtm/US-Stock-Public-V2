name: V4 SEC Cover Share Incremental Price-Available
on:
  push:
    paths:
      - 'v4-sec-cover-incremental-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Fetch SEC DEI cover shares and acceptance times
        run: python v4-sec-cover/recover_dei_cover_facts_incremental.py
      - name: Commit outcome-free SEC supplement
        run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-cover-incremental-output/dei_cover_share_facts.csv
          git add v4-sec-cover-incremental-output/sec_cover_fetch_audit.csv
          git add v4-sec-cover-incremental-output/summary.json
          git commit -m 'Add V4 incremental SEC cover-share supplement' || true
          git pull --rebase origin main
          git push origin HEAD:main
