name: V4 PWB Daily OHLCV Probe
on:
  push:
    paths: ['v4-pwb-daily-probe-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas numpy
      - run: python v4-pwb-daily/probe.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-pwb-daily-probe-output/
          git commit -m 'Add PWB daily OHLCV probe' || true
          git pull --rebase origin main
          git push origin HEAD:main
