name: V4 Market Cap CompanyFacts Retry R2
on:
  push:
    paths: ['v4-mcap-companyfacts-retry-r2-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests
      - run: python v4-sec-cover/recover_mcap_companyfacts_retry_r2.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-mcap-companyfacts-retry-r2
          path: v4-sec-mcap-companyfacts-retry-r2-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-mcap-companyfacts-retry-r2-output/summary.json v4-sec-mcap-companyfacts-retry-r2-output/audit.csv
          git commit -m 'Add V4 mcap CompanyFacts retry R2 summary' || true
          git pull --rebase origin main
          git push origin HEAD:main
