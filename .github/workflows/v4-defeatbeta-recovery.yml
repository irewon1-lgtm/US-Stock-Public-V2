name: V4 DefeatBeta Unknown Price Recovery
on:
  push:
    paths: ['v4-defeatbeta-recovery-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas numpy
      - run: python v4-defeatbeta/recover_unknown.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-defeatbeta-unknown-recovery
          path: |
            v4-defeatbeta-recovery-output/unknown_recovery.csv.gz
            v4-defeatbeta-recovery-output/source_validation.csv
            v4-defeatbeta-recovery-output/summary.json
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-defeatbeta-recovery-output/source_validation.csv v4-defeatbeta-recovery-output/summary.json
          git commit -m 'Add V4 DefeatBeta price recovery summary' || true
          git pull --rebase origin main
          git push origin HEAD:main
