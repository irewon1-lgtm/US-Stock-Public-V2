name: V4 SEC F34 Exact Alternative Recovery
on:
  push:
    paths:
      - 'v4-sec-f34-exact-alt-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - name: Recover exact-semantic SEC PIT alternative facts
        run: python v4-sec-cover/recover_f34_exact_alt_facts.py
      - name: Commit outcome-free exact alternative facts
        run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-f34-exact-alt-output/
          git commit -m 'Add V4 NEXT1 exact SEC F34 alternative facts' || true
          git pull --rebase origin main
          git push origin HEAD:main
