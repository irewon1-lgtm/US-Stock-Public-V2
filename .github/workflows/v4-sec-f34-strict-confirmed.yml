name: V4 SEC F34 Strict Confirmed Recovery
on:
  push:
    paths:
      - 'v4-sec-f34-strict-confirmed-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - name: Rebuild strict PIT F3 F4 confirmed recovery
        env:
          TARGET_B64_OVERRIDE: ''
        run: python v4-sec-cover/recover_f34_strict_matrix.py
      - name: Preserve confirmed-only output
        run: |
          mkdir -p v4-sec-f34-strict-confirmed-output
          cp v4-sec-f34-strict-recovery-output/recovery_bitmask.json v4-sec-f34-strict-confirmed-output/recovery_bitmask.json
          cp v4-sec-f34-strict-recovery-output/fetch_audit.json v4-sec-f34-strict-confirmed-output/fetch_audit.json
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-f34-strict-confirmed-output/
          git commit -m 'Add confirmed-only V4 strict recovery bitmask' || true
          git pull --rebase origin main
          git push origin HEAD:main
