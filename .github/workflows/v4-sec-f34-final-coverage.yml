name: V4 NEXT1 Final Coverage Postprocess
on:
  push:
    paths:
      - 'v4-sec-f34-final-coverage-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  postprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Intersect strict recovery with frozen NONFIN baseline
        run: python v4-sec-cover/postprocess_f34_final_coverage.py
      - name: Commit final NEXT1 coverage
        run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-f34-strict-recovery-output/final_nonfin_coverage.json
          git add v4-sec-f34-strict-recovery-output/final_nonfin_coverage.csv
          git commit -m 'Add V4 NEXT1 final NONFIN F3 F4 coverage' || true
          git pull --rebase origin main
          git push origin HEAD:main
