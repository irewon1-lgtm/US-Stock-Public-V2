name: V4 Stooq POW Probe
on:
  push:
    paths: ['v4-stooq-pow-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests
      - run: python v4-stooq/probe_pow.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-stooq-probe-output/pow_probe.json
          git commit -m 'Add Stooq POW probe result' || true
          git pull --rebase origin main
          git push origin HEAD:main
