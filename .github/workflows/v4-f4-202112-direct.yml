name: V4 F4 2021-12 Direct Standard Shares
on:
  push:
    paths:
      - 'v4-f4-202112-direct-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests lxml
      - run: python v4-sec-cover/recover_f4_202112_direct_standard.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-f4-202112-direct
          path: v4-sec-f4-202112-direct-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-f4-202112-direct-output/
          git commit -m 'Add targeted F4 direct standard share facts' || true
          git pull --rebase origin main
          git push origin HEAD:main
