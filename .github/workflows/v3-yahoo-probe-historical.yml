name: V3 Yahoo Historical Probe
on:
  push:
    paths:
      - 'v3-probe-historical-trigger.txt'
      - '.github/workflows/v3-yahoo-probe-historical.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pandas
      - name: Probe free Stooq fallback on Yahoo-missing sample
        run: |
          python - <<'PY'
          import requests,time,io,pandas as pd,json
          syms=['ABMD','AAWW','AVDL','CPRX','CTRA','AVB','EA','WBS','ACLX','ADVM']
          out=[]
          for s in syms:
            u='https://stooq.com/q/d/l/'
            p={'s':s.lower()+'.us','d1':'20190101','d2':'20260215','i':'d'}
            row={'s':s}
            try:
              r=requests.get(u,params=p,timeout=15,headers={'User-Agent':'Mozilla/5.0'})
              row['code']=r.status_code; row['bytes']=len(r.content); row['head']=r.text[:100].replace('\n',' ')
              try:
                d=pd.read_csv(io.StringIO(r.text))
                row['rows']=len(d); row['first']=str(d.iloc[0,0]) if len(d) else ''; row['last']=str(d.iloc[-1,0]) if len(d) else ''
              except Exception as e:
                row['rows']=0; row['parse']=repr(e)[:120]
            except Exception as e:
              row.update(code='EXC',bytes=0,rows=0,head=repr(e)[:120])
            out.append(row); time.sleep(.2)
          print(json.dumps(out,indent=2))
          PY
