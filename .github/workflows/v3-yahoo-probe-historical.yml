name: V3 Yahoo Historical Probe
on:
  push:
    paths:
      - 'v3-probe-historical-trigger.txt'
      - '.github/workflows/v3-yahoo-probe-historical.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Probe yearly historical windows for 43 failures
        run: |
          python - <<'PY'
          import requests,time,json,urllib.parse,datetime as dt
          syms=['AACI','AFBI','ALOT','ASRT','ATAI','AVB','BREW','BRKL','BWNB','CIR','CLIM','CRNX','CTAA','DHCNL','DICE','EA','ELSE','FBRX','GV','HLX','ITG','KALV','LBRDP','LEG','LMNX','LPRO','MCVT','MIC','NCSM','NFBK','OLPX','PS','RNA','ROC','RVI','SAT','SCA','SKYT','TALK','TWO','VIASP','WBS','WSR']
          def ux(s):
              return int(dt.datetime.fromisoformat(s).replace(tzinfo=dt.timezone.utc).timestamp())
          windows=[
            ('2019_2021',ux('2019-01-01'),ux('2021-01-01')),
            ('2021_2023',ux('2021-01-01'),ux('2023-01-01')),
            ('2023_2025',ux('2023-01-01'),ux('2025-01-01')),
            ('2025_2026',ux('2025-01-01'),ux('2026-02-15')),
          ]
          out=[]
          for s in syms:
            ys=s.replace('.','-').replace('/','-')
            u=f'https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(ys,safe="")}'
            for w,p1,p2 in windows:
              p={'period1':p1,'period2':p2,'interval':'1d','events':'div,splits','includeAdjustedClose':'true','includePrePost':'false'}
              row={'s':s,'window':w}
              try:
                r=requests.get(u,params=p,timeout=8,headers={'User-Agent':'Mozilla/5.0 V3-Year-Probe'})
                row['code']=r.status_code
                try:
                  j=r.json(); ch=j.get('chart') or {}; rs=ch.get('result') or []; er=ch.get('error')
                  ts=(rs[0].get('timestamp') or []) if rs else []
                  row['n']=len(ts)
                  row['first']=time.strftime('%Y-%m-%d',time.gmtime(ts[0])) if ts else ''
                  row['last']=time.strftime('%Y-%m-%d',time.gmtime(ts[-1])) if ts else ''
                  row['desc']=((er or {}).get('description','') if isinstance(er,dict) else str(er or ''))[:100]
                except Exception:
                  row.update(n=0,first='',last='',desc='')
              except Exception as e:
                row.update(code='EXC',n=0,first='',last='',desc=repr(e)[:100])
              out.append(row); time.sleep(.02)
          recovered={}
          for x in out:
            if x['code']==200 and x['n']>0:
              recovered.setdefault(x['s'],[]).append(x['window'])
          print(json.dumps(out,indent=2))
          print('RECOVERED_WINDOWS',json.dumps(recovered,sort_keys=True))
          print('FULLY_UNRESOLVED',','.join([s for s in syms if s not in recovered]))
          PY
