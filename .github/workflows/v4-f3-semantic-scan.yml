name: V4 F3 Semantic Concept Scan
on:
  push:
    paths:
      - 'v4-f3-semantic-scan-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python v4-sec-cover/scan_f3_semantic_concepts.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-f3-semantic-scan-output/
          git commit -m 'Add V4 F3 semantic concept scan' || true
          git pull --rebase origin main
          git push origin HEAD:main
