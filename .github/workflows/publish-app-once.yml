name: Publish V2 app once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-app-once.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-v2-static-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Preserve live data and publish app
        shell: bash
        env:
          LIVE_BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          BASE="${LIVE_BASE%/}"
          mkdir -p "$RUNNER_TEMP/site"
          curl -L -fSs --connect-timeout 10 --max-time 120 --retry 3 "$BASE/state-v2.json?cb=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/site/state-v2.json"
          curl -L -fSs --connect-timeout 10 --max-time 60 --retry 3 "$BASE/last-refresh.json?cb=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/site/last-refresh.json"
          python scripts/validate-state.py "$RUNNER_TEMP/site/state-v2.json" data/universe-3700.json config/metrics-v2.json
          cp config/metrics-v2.json "$RUNNER_TEMP/site/metrics-v2.json"
          cp engine/rank-filter-engine.mjs "$RUNNER_TEMP/site/rank-filter-engine.mjs"
          cp chart.html "$RUNNER_TEMP/site/chart.html"
          cp web/index.html "$RUNNER_TEMP/site/index.html"
          cp web/styles.css "$RUNNER_TEMP/site/styles.css"
          cp web/app.js "$RUNNER_TEMP/site/app.js"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
          retention-days: 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
