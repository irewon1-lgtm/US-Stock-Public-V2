name: V4 BCPC CAPEX Tag Switch Probe
on:
  push:
    paths: ['v4-bcpc-tag-switch-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests lxml
      - run: python v4-sec-cover/probe_bcpc_tag_switch.py > v4-bcpc-tag-switch.log 2>&1
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-bcpc-tag-switch.log
          git commit -m 'Add BCPC tag-switch probe log' || true
          git pull --rebase origin main
          git push origin HEAD:main
