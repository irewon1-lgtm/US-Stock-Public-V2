name: V4 F4 2021-12 Exact Share Batch1
on:
  push:
    paths: ['v4-f4-2021-12-batch1-trigger.txt']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests lxml
      - run: python v4-sec-cover/recover_f4_2021_12_batch1.py --shard ${{ matrix.shard }} --nshards 4
      - uses: actions/upload-artifact@v4
        with:
          name: v4-f4-2021-12-batch1-${{ matrix.shard }}
          path: v4-sec-f4-2021-12-batch1-output/
          retention-days: 30
