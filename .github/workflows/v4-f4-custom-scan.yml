name: V4 F4 Custom Namespace Scan
on:
  push:
    paths:
      - 'v4-f4-custom-scan-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python v4-sec-cover/scan_f4_custom_namespaces.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-sec-f34-custom-scan-output/summary.json
          git commit -m 'Add V4 F4 custom namespace scan' || true
          git pull --rebase origin main
          git push origin HEAD:main
