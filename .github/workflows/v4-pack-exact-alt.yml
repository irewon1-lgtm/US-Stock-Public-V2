name: V4 Pack Exact Alt Facts
on:
  push:
    paths:
      - 'v4-pack-exact-alt-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v4-exact-alt-facts
          path: v4-sec-f34-exact-alt-output/exact_alt_facts.csv
          retention-days: 30
