name: V4 Eulerpool Factor Source Probe
on:
  push:
    paths:
      - 'v4-eulerpool-factor-probe-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - env:
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
        run: python v4-eulerpool/factor_source_probe.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          git add v4-eulerpool-output/factor_source_probe.json
          git commit -m 'Add V4 factor source probe' || true
          git push || true
