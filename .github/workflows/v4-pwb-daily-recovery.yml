name: V4 PWB Daily Recovery
on:
  push:
    paths: ['v4-pwb-daily-recovery-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas
      - run: python v4-pwb-daily/recover.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-pwb-daily-recovery
          path: v4-pwb-daily-recovery-output/
          retention-days: 30
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-pwb-daily-recovery-output/summary.json
          git commit -m 'Add PWB daily recovery summary' || true
          git pull --rebase origin main
          git push origin HEAD:main
