name: V4 Eulerpool MCap Recovery
on:
  push:
    paths:
      - 'v4-eulerpool-mcap-recovery-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas requests
      - name: Extract only 12 formation-date market caps
        env:
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
        run: python v4-eulerpool/mcap_recover.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4-eulerpool-mcap-recovery
          path: |
            v4-eulerpool-output/mcap_recovery_snapshots.csv
            v4-eulerpool-output/mcap_recovery_audit.csv
            v4-eulerpool-output/mcap_recovery_summary.json
          retention-days: 1
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          git add v4-eulerpool-output/mcap_recovery_snapshots.csv v4-eulerpool-output/mcap_recovery_audit.csv v4-eulerpool-output/mcap_recovery_summary.json
          git commit -m 'Add V4 Eulerpool market cap recovery' || true
          git push || true
