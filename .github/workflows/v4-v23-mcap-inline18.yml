name: V4 V23 MCap Inline 18
on:
  push:
    paths: ['v4-v23-mcap-inline18-trigger.txt']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas requests lxml
      - run: python v4-sec-cover/recover_v23_mcap_inline_18.py --shard ${{ matrix.shard }} --nshards 4
      - uses: actions/upload-artifact@v4
        with:
          name: v4-v23-mcap-inline18-${{ matrix.shard }}
          path: |
            v4-v23-mcap-inline-18-output/inline_standard_shares_*.csv.gz
            v4-v23-mcap-inline-18-output/audit_*.csv
            v4-v23-mcap-inline-18-output/summary_*.json
          retention-days: 30
