name: V4 Pack Incremental SEC Cover
on:
  push:
    paths:
      - 'v4-pack-sec-cover-incremental-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v4-sec-cover-incremental
          path: v4-sec-cover-incremental-output/
          retention-days: 30
