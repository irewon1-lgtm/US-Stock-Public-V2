name: V4 Split Audit
on:
  push:
    paths: ['v4-split-audit-trigger.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q duckdb pandas
      - run: python v4-split-audit/probe.py
      - run: |
          git config user.name 'v4-free-runner'
          git config user.email 'actions@users.noreply.github.com'
          git add v4-split-audit-output/
          git commit -m 'Add V4 split audit' || true
          git pull --rebase origin main
          git push origin HEAD:main
