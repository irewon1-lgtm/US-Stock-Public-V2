<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>US Stock V2 Chart</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;color:#eaf1fb}
  .wrap{width:100%;height:100%;min-height:320px;background:#070b12}
  .tradingview-widget-container,
  .tradingview-widget-container__widget{width:100%;height:100%}
  .tradingview-widget-copyright{
    position:absolute;right:8px;bottom:4px;z-index:4;
    font:10px system-ui,-apple-system,sans-serif;color:#71839a
  }
  .tradingview-widget-copyright a{color:#6faeff;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="tradingview-widget-container" style="height:100%;width:100%">
    <div class="tradingview-widget-container__widget" style="height:calc(100% - 18px);width:100%"></div>
    <div class="tradingview-widget-copyright">
      <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">TradingView</a>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
    {
      "autosize": true,
      "symbol": "NASDAQ:AAPL",
      "interval": "D",
      "timezone": "exchange",
      "theme": "dark",
      "style": "3",
      "locale": "ko",
      "backgroundColor": "#070b12",
      "gridColor": "rgba(255,255,255,0.06)",
      "hide_side_toolbar": true,
      "hide_top_toolbar": false,
      "hide_legend": true,
      "hide_volume": true,
      "withdateranges": true,
      "allow_symbol_change": false,
      "save_image": false,
      "calendar": false,
      "details": false,
      "hotlist": false,
      "support_host": "https://www.tradingview.com"
    }
    </script>
  </div>
</div>
</body>
</html>
